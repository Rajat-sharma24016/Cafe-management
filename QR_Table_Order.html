<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brew & Co - Table Order</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#18211c;--muted:#6a6f6b;--line:#e3dfd7;--paper:#fffdf8;--bg:#f2f0eb;--accent:#b87333;--accent-dark:#93591f;--green:#27764e;--danger:#b93b2f}
html,body{min-height:100%;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.45}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:1120px;margin:0 auto;padding:22px 18px 96px}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.brand{font-size:24px;font-weight:800;letter-spacing:0;color:var(--ink)}
.sub{font-size:13px;color:var(--muted);margin-top:2px}
.table-pill{background:#10251d;color:#fff;border-radius:999px;padding:8px 13px;font-weight:700;font-size:13px;white-space:nowrap}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:18px}
.panel-title{font-size:15px;font-weight:700;margin-bottom:12px}
.guest-grid{display:grid;grid-template-columns:1fr 1fr 120px;gap:10px}
.field label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px}
.field input,.field textarea{width:100%;border:1px solid var(--line);border-radius:7px;background:#fff;padding:10px 11px;color:var(--ink);outline:none}
.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(184,115,51,.13)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:16px 0}
.tab{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.menu{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.item{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px}
.item-head{display:flex;justify-content:space-between;gap:12px}
.item-name{font-weight:700}
.item-cat{font-size:12px;color:var(--muted);margin-top:2px}
.price{font-weight:800;color:var(--accent);white-space:nowrap}
.qty{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:#fff}
.stepper button{width:34px;height:32px;border:0;background:#f5f2ed;font-weight:800;color:var(--ink)}
.stepper span{width:36px;text-align:center;font-weight:700}
.cart{position:sticky;top:16px}
.cart-lines{display:grid;gap:10px;margin:8px 0 14px}
.cart-line{display:flex;justify-content:space-between;gap:12px;font-size:13px}
.cart-line strong{font-size:13px}
.cart-empty{font-size:13px;color:var(--muted);padding:18px 0}
.total{border-top:1px solid var(--line);padding-top:13px;display:flex;align-items:center;justify-content:space-between;font-size:18px;font-weight:800}
.notes{margin-top:12px}
.submit{width:100%;margin-top:14px;border:0;border-radius:8px;background:var(--accent);color:#fff;font-weight:800;padding:13px 16px}
.submit:hover{background:var(--accent-dark)}
.submit:disabled{opacity:.45;cursor:not-allowed}
.success{display:none;margin-top:12px;border:1px solid rgba(39,118,78,.28);background:rgba(39,118,78,.09);color:var(--green);border-radius:8px;padding:12px;font-size:13px;font-weight:700}
.hint{font-size:12px;color:var(--muted);margin-top:12px}
.order-id{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}
@media(max-width:820px){.grid{grid-template-columns:1fr}.guest-grid{grid-template-columns:1fr}.menu{grid-template-columns:1fr}.cart{position:static}.app{padding:18px 14px 120px}.brand{font-size:21px}}
</style>
</head>
<body>
<main class="app">
  <header class="top">
    <div>
      <div class="brand">Brew &amp; Co</div>
      <div class="sub">Order from your table</div>
    </div>
    <div class="table-pill">Table <span id="tableBadge">--</span></div>
  </header>

  <section class="grid">
    <div>
      <div class="panel">
        <div class="panel-title">Guest Details</div>
        <div class="guest-grid">
          <div class="field">
            <label for="guestName">Name</label>
            <input id="guestName" autocomplete="name" placeholder="Your name">
          </div>
          <div class="field">
            <label for="guestPhone">Mobile</label>
            <input id="guestPhone" inputmode="tel" autocomplete="tel" placeholder="10 digit number">
          </div>
          <div class="field">
            <label for="tableNo">Table</label>
            <input id="tableNo" inputmode="numeric" placeholder="Table no.">
          </div>
        </div>
      </div>

      <div class="tabs" id="categoryTabs"></div>
      <div class="menu" id="menuGrid"></div>
    </div>

    <aside class="panel cart">
      <div class="panel-title">Your Order</div>
      <div class="cart-lines" id="cartLines"></div>
      <div class="total"><span>Total</span><span id="cartTotal">₹0</span></div>
      <div class="field notes">
        <label for="notes">Notes</label>
        <textarea id="notes" rows="3" placeholder="Less sugar, no onion, extra hot..."></textarea>
      </div>
      <button class="submit" id="submitOrder">Place Order</button>
      <div class="success" id="successBox"></div>
      <div class="hint">Your order is saved to the manager dashboard on this device. Production mode can send this to Supabase/n8n.</div>
    </aside>
  </section>
</main>

<script>
const MENU_ITEMS = [
  {name:'Cappuccino',cat:'Coffee',price:180,avail:true},
  {name:'Cold Coffee',cat:'Coffee',price:160,avail:true},
  {name:'Espresso',cat:'Coffee',price:120,avail:true},
  {name:'Cold Brew',cat:'Coffee',price:200,avail:true},
  {name:'Latte',cat:'Coffee',price:190,avail:true},
  {name:'Paneer Sandwich',cat:'Food',price:220,avail:true},
  {name:'Margherita Pizza',cat:'Food',price:350,avail:true},
  {name:'Grilled Sandwich',cat:'Food',price:210,avail:false},
  {name:'Veg Wrap',cat:'Food',price:195,avail:true},
  {name:'Chocolate Cake',cat:'Desserts',price:240,avail:true},
  {name:'Cheesecake',cat:'Desserts',price:260,avail:true},
  {name:'Blueberry Muffin',cat:'Desserts',price:130,avail:true},
  {name:'Masala Chai',cat:'Beverages',price:60,avail:true},
  {name:'Green Tea',cat:'Beverages',price:80,avail:true},
  {name:'Fresh Lime Soda',cat:'Beverages',price:90,avail:true},
];

const params = new URLSearchParams(location.search);
const initialTable = params.get('table') || '';
const cart = new Map();
let currentCat = 'All';

const tableInput = document.getElementById('tableNo');
const tableBadge = document.getElementById('tableBadge');
tableInput.value = initialTable;
tableBadge.textContent = initialTable || '--';
tableInput.addEventListener('input', () => tableBadge.textContent = tableInput.value.trim() || '--');

function money(v){ return '₹' + Number(v || 0).toLocaleString('en-IN'); }
function categories(){ return ['All', ...new Set(MENU_ITEMS.filter(i => i.avail).map(i => i.cat))]; }

function renderTabs(){
  document.getElementById('categoryTabs').innerHTML = categories().map(cat =>
    `<button class="tab ${cat === currentCat ? 'active' : ''}" onclick="setCat('${cat}')">${cat}</button>`
  ).join('');
}

function setCat(cat){ currentCat = cat; renderTabs(); renderMenu(); }

function renderMenu(){
  const data = MENU_ITEMS.filter(i => i.avail && (currentCat === 'All' || i.cat === currentCat));
  document.getElementById('menuGrid').innerHTML = data.map(item => {
    const qty = cart.get(item.name)?.qty || 0;
    return `<article class="item">
      <div class="item-head">
        <div>
          <div class="item-name">${item.name}</div>
          <div class="item-cat">${item.cat}</div>
        </div>
        <div class="price">${money(item.price)}</div>
      </div>
      <div class="qty">
        <span>${qty ? qty + ' in cart' : 'Add item'}</span>
        <div class="stepper">
          <button type="button" onclick="changeQty('${item.name}',-1)">-</button>
          <span>${qty}</span>
          <button type="button" onclick="changeQty('${item.name}',1)">+</button>
        </div>
      </div>
    </article>`;
  }).join('');
}

function changeQty(name, delta){
  const item = MENU_ITEMS.find(i => i.name === name);
  const current = cart.get(name)?.qty || 0;
  const next = Math.max(0, current + delta);
  if (!next) cart.delete(name);
  else cart.set(name, {name:item.name, cat:item.cat, price:item.price, qty:next});
  renderMenu();
  renderCart();
}

function cartItems(){ return [...cart.values()]; }
function cartTotal(){ return cartItems().reduce((sum, i) => sum + i.price * i.qty, 0); }

function renderCart(){
  const lines = cartItems();
  document.getElementById('cartLines').innerHTML = lines.length ? lines.map(i =>
    `<div class="cart-line"><div><strong>${i.qty} x ${i.name}</strong><br><span>${money(i.price)} each</span></div><strong>${money(i.price * i.qty)}</strong></div>`
  ).join('') : '<div class="cart-empty">No items added yet.</div>';
  document.getElementById('cartTotal').textContent = money(cartTotal());
}

function readOrders(){
  try { return JSON.parse(localStorage.getItem('cafeTableOrders') || '[]'); }
  catch { return []; }
}

async function saveOrder(order){
  try {
    const response = await fetch('/api/orders', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(order),
    });
    if (response.ok) return {source:'server', data: await response.json()};
  } catch {}
  const orders = readOrders();
  orders.unshift(order);
  localStorage.setItem('cafeTableOrders', JSON.stringify(orders.slice(0, 100)));
  return {source:'local'};
}

document.getElementById('submitOrder').addEventListener('click', async () => {
  const name = document.getElementById('guestName').value.trim();
  const phone = document.getElementById('guestPhone').value.trim();
  const table = tableInput.value.trim();
  const items = cartItems();
  const success = document.getElementById('successBox');
  if (!table || !name || !phone || !items.length) {
    success.style.display = 'block';
    success.style.color = '#b93b2f';
    success.style.borderColor = 'rgba(185,59,47,.28)';
    success.style.background = 'rgba(185,59,47,.08)';
    success.textContent = 'Please enter table, name, mobile number, and add at least one item.';
    return;
  }
  const order = {
    id: 'QR-' + Date.now().toString().slice(-7),
    customer: name,
    phone,
    table,
    items,
    itemsText: items.map(i => `${i.name} x${i.qty}`).join(', '),
    total: cartTotal(),
    type: 'Table ' + table,
    status: 'pending',
    source: 'table_qr',
    notes: document.getElementById('notes').value.trim(),
    time: new Date().toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'})
  };
  const saved = await saveOrder(order);
  success.style.display = 'block';
  success.style.color = '#27764e';
  success.style.borderColor = 'rgba(39,118,78,.28)';
  success.style.background = 'rgba(39,118,78,.09)';
  success.innerHTML = `Order placed. ID: <span class="order-id">${saved.data?.order?.order_code || order.id}</span>${saved.source === 'local' ? ' (local demo mode)' : ''}`;
  cart.clear();
  renderMenu();
  renderCart();
});

renderTabs();
renderMenu();
renderCart();
</script>
</body>
</html>
